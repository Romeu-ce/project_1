name: Тести

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Завантажити код
        uses: actions/checkout@v3

      - name: Встановити Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Встановити залежності
        run: npm install

      - name: Запустити тести
        run: npm test
